<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>CSS Transform</title>
    <style>
        li a:hover {
            -webkit-transform: rotate(-10deg) scale(2);
            transform: rotate(-10deg) scale(2);
        }
    </style>
</head>
<body>
    <ul>
        <li><a href="#">Hover me!</a></li>
        <li><a href="#">Hover me!</a></li>
        <li><a href="#">Hover me!</a></li>
        <li><a href="#">Hover me!</a></li>
    </ul>
</body>
</html>
